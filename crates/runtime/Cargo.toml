[package]
name = "braintrade-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
braintrade-domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
quick-xml = "=0.41.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

