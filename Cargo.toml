[workspace]
members = ["crates/domain", "crates/runtime", "crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"


[profile.release]
strip = true
debug = false

# Keep the generated Slint desktop in one codegen unit for the Windows cross-build.
[profile.release.package.braintrade-desktop]
codegen-units = 1
opt-level = 2
