name: Apply Intelligence V3 final learner

on:
  push:
    branches: [feature/intelligence-v3-final]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify final learner
        shell: bash
        run: |
          cat .iv3-final/part-* | base64 -d > crates/runtime/src/coordinator_learning.rs
          echo "95a1d792f49a7dc4d2f4f3879f5696e29a01ea2d16103ecb90839580029fcb69  crates/runtime/src/coordinator_learning.rs" | sha256sum -c -
          test "$(git hash-object crates/runtime/src/coordinator_learning.rs)" = "ea5099977de4825bd482bbc1258015492a178526"
      - name: Commit final source and clean staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .iv3-final
          git rm .github/workflows/apply-intelligence-v3-final.yml
          git add crates/runtime/src/coordinator_learning.rs crates/domain/src/execution.rs
          git commit -m "Complete Intelligence V3 learning engine"
          git push origin HEAD:feature/intelligence-v3-final
