name: V25 G6-D Causal Expert Learning Attribution
on:
  workflow_dispatch:
  push:
    branches: [feature/v25-g6d-causal-member-learning-attribution-20261025]
    paths:
      - 'scripts/audit_v25_g6d_causal_learning_evidence.py'
      - 'tests/test_v25_g6d_causal_learning_evidence.py'
      - '.github/workflows/v25-g6d-learning-evidence.yml'
  pull_request:
    branches: [feature/v25-g6c-portable-demo-study-tools-20261025]
permissions:
  contents: read
jobs:
  causal-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile read-only model-evidence audit
        run: python3 -m compileall -q scripts/audit_v25_g6d_causal_learning_evidence.py tests/test_v25_g6d_causal_learning_evidence.py
      - name: Test causal member count provenance and no fake OOS certification
        run: python3 -m unittest discover -s tests -p 'test_v25_g6d_causal_learning_evidence.py' -v
      - name: Keep preregistration and executed Broker evidence gates green
        run: |
          python3 -m unittest discover -s tests -p 'test_v25_g6a_preregistered_quotes.py' -v
          python3 -m unittest discover -s tests -p 'test_v25_g6b_executed_demo_arm.py' -v
