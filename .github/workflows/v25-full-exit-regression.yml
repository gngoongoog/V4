name: V25 full-exit process regression

on:
  push:
    branches: [fix/v25-full-exit-lifecycle-20261028]
  pull_request:
    paths:
      - 'apps/tauri/src/**'
      - 'apps/terminal/src/terminal.tsx'
      - 'crates/runtime/src/lib.rs'
      - 'gateway/mt5_gateway.py'
      - 'tests/test_full_exit_*.py'
      - '.github/workflows/v25-full-exit-regression.yml'

permissions:
  contents: read

jobs:
  core-gateway-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo test --locked -p braintrade-runtime full_exit_is_blocked_if_monitoring_or_account_is_unverified
      - run: cargo build --locked -p braintrade-runtime --bin braintrade-core
      - run: python -B -m unittest discover -s tests -p 'test_full_exit_*.py' -v

  tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/terminal ci --no-audit --no-fund
      - run: npm --prefix apps/terminal run build
      - run: cargo test --locked -p braintrade-tauri --bin BrainTradeNext
