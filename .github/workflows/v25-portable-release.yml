name: V25 Enterprise Windows Portable Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/v25-portable-release.yml'
      # Gateway, EA and release checks are shipped or executed by this build.
      # A change to any of them must produce a new portable, not an old ZIP.
      - 'gateway/**'
      - 'mt5/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'VERIFY_SYSTEM.cmd'
      - 'V25_P0_DIAGNOSTICS_README_AR.txt'
      - 'scripts/Build-V25-Portable-Windows.ps1'
      - 'scripts/package_v25.py'
      - 'scripts/release_identity.py'
      - 'release.json'
      - 'release-inputs.json'
      - 'tools/windows-gui/**'
      - 'scripts/check_v25_g7h_package.py'
      - 'scripts/Run-G7-Acceptance.ps1'
      - 'scripts/Run-G7-Acceptance.cmd'
      - 'docs/v25/USER_MANUAL_V25_AR.md'
      - 'docs/v25/G7H_NATIVE_DEMO_ACCEPTANCE_AR.md'
      - 'tests/test_g7_demo_acceptance_packet.py'
      - 'apps/tauri/**'
      - 'apps/terminal/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

concurrency:
  group: v25-portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Native V25 Tauri React complete build, tests, relocation and portable ZIP
        shell: pwsh
        run: ./scripts/Build-V25-Portable-Windows.ps1
      - name: Upload portable V25 release candidate (NOT LIVE approved)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BRAINTRADE_V4_V25_PORTABLE_Windows_x64_RC
          path: target/portable/BRAINTRADE_V4_ENTERPRISE_V25_PORTABLE_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload native V25 build and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRAINTRADE_V25_Portable_RC_Validation
          path: test-output/v25/
          if-no-files-found: warn
          retention-days: 30

  native-webview:
    needs: portable-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: BRAINTRADE_V4_V25_PORTABLE_Windows_x64_RC
          path: test-output/download
      - name: Extract the exact same-run portable
        shell: pwsh
        run: Expand-Archive test-output/download/BRAINTRADE_V4_ENTERPRISE_V25_PORTABLE_Windows_x64.zip -DestinationPath test-output/actual-portable
      - run: npm --prefix tools/windows-gui ci --ignore-scripts --no-audit --no-fund
      - name: Actual Tauri WebView2 controls, pages, settings and restart
        shell: pwsh
        run: node tools/windows-gui/acceptance.mjs test-output/actual-portable/BRAINTRADE_V4_ENTERPRISE_V25/BrainTradeNext.exe test-output/v25/native-webview
      - name: Upload actual WebView2 evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRAINTRADE_V25_RC2_Native_WebView_Evidence
          path: test-output/v25/native-webview/
          if-no-files-found: error
          retention-days: 30
