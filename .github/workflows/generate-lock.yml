name: Generate Cargo lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test -s Cargo.lock
      - name: Commit lock and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git rm .github/workflows/generate-lock.yml
          git commit -m 'Generate Cargo lockfile'
          git push origin HEAD:main
