name: Apply Brain Snapshot Patch

on:
  push:
    branches: [feature/portable-brain-snapshot]
    paths:
      - '.patches/brain-snapshot/**'
      - '.github/workflows/apply-brain-snapshot-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and preserve repository line endings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              "crates/runtime/src/backup.rs",
              "crates/runtime/src/lib.rs",
              "crates/desktop/src/backup.rs",
              "crates/desktop/ui/main.slint",
          ]
          for name in files:
              p = Path(name)
              p.write_text(p.read_text().replace("\r\n", "\n"), newline="\n")
          PY
          cat .patches/brain-snapshot/part-* > /tmp/brain-snapshot.patch
          git apply --check /tmp/brain-snapshot.patch
          git apply /tmp/brain-snapshot.patch
          python3 - <<'PY'
          from pathlib import Path
          files = [
              "crates/runtime/src/backup.rs",
              "crates/runtime/src/lib.rs",
              "crates/desktop/src/backup.rs",
              "crates/desktop/ui/main.slint",
          ]
          for name in files:
              p = Path(name)
              text = p.read_text().replace("\r\n", "\n")
              p.write_bytes(text.replace("\n", "\r\n").encode())
          PY
          git rm -r .patches/brain-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runtime/src/backup.rs crates/runtime/src/lib.rs crates/desktop/src/backup.rs crates/desktop/ui/main.slint docs/BRAIN_SNAPSHOT_AR.md
          git commit -m "Add portable Brain Snapshot transfer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
