name: Normalize Brain Snapshot Lines

on:
  push:
    branches: [feature/portable-brain-snapshot]
    paths:
      - '.github/workflows/normalize-brain-snapshot-lines.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize edited source files to LF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              "crates/runtime/src/backup.rs",
              "crates/runtime/src/lib.rs",
              "crates/desktop/src/backup.rs",
              "crates/desktop/ui/main.slint",
          ]
          for name in files:
              p = Path(name)
              text = p.read_bytes().decode().replace("\r\n", "\n")
              p.write_bytes(text.encode())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runtime/src/backup.rs crates/runtime/src/lib.rs crates/desktop/src/backup.rs crates/desktop/ui/main.slint
          git commit -m "Normalize Brain Snapshot source line endings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
