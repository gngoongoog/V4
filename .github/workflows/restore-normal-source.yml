name: Restore normal source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/restore-normal-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .import
          mapfile -t parts < <(find .import -maxdepth 1 -type f -name 'c*.txt' -printf '%f\n' | sort -V)
          test "${#parts[@]}" -gt 0
          : > /tmp/source.b64
          for part in "${parts[@]}"; do
            cat ".import/$part" >> /tmp/source.b64
          done
          tr -d '\r\n\t ' < /tmp/source.b64 > /tmp/source.clean.b64
          base64 --decode /tmp/source.clean.b64 > /tmp/source.zip
          unzip -t /tmp/source.zip
          rm -rf /tmp/braintrade-source
          mkdir -p /tmp/braintrade-source
          unzip -q /tmp/source.zip -d /tmp/braintrade-source
          test -f /tmp/braintrade-source/Cargo.toml
          test -d /tmp/braintrade-source/crates
          test -d /tmp/braintrade-source/gateway
          test -d /tmp/braintrade-source/scripts
          test -d /tmp/braintrade-source/tests

      - name: Replace staging files with normal project files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/braintrade-source/. .
          test ! -e .import
          test -f Cargo.toml
          test -d crates
          test -d gateway
          test -d scripts
          test -d tests

      - name: Commit restored normal source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Restore BrainTrade OS as normal source files'
          git push origin HEAD:main

# one-time migration trigger
