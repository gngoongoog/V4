name: V25 P0-O canonical source and Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [feature/v25-enterprise-validation-20261024]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'gateway/**'
      - 'mt5/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'VERIFY_SYSTEM.cmd'
      - '.github/workflows/v25-enterprise-portable.yml'
  pull_request:
    branches: [main, feature/v25-enterprise-validation-20261024, feature/v25-p1k4-same-clock-sniper-quote-integrity-20261024, feature/v25-p1k5-classic-prospective-research-20261024, feature/v25-p1k5b-sniper-forward-direction-audit-20261024, feature/v25-p1k5c-learner-training-cutoff-provenance-20261024, feature/v25-p1k5d-immutable-research-checkpoint-20261024, feature/v25-p1k5e-prospective-event-journal-20261024, feature/v25-p1k5f-chronological-holdout-diagnostics-20261024]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked -p braintrade-domain -p braintrade-runtime
      - run: cargo build --locked -p braintrade-runtime --bin braintrade-core
      - run: python3 -m unittest discover -s tests -v
      - run: npm --prefix apps/terminal ci --no-audit --no-fund
      - run: npm --prefix apps/terminal test
      - run: npm --prefix apps/terminal run build
      - name: Isolated Core integrations, no broker connectivity
        run: |
          python3 scripts/smoke_core.py
          python3 scripts/check_backup_restore.py
          python3 scripts/check_studio.py
          python3 scripts/check_execution.py
          python3 scripts/check_priority_handoff.py
          python3 scripts/check_flexible_demo.py
          python3 scripts/check_sniper_learner.py
          python3 scripts/check_sniper_quote_clock.py
      - run: git diff --exit-code -- Cargo.lock apps/terminal/package-lock.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build directly from locked source and verify actual Portable Core
        shell: pwsh
        run: ./scripts/Build-V25-Portable-Windows.ps1
      - name: Exact source archive
        shell: pwsh
        run: git archive --format=zip --prefix=BRAINTRADE_V4_ENTERPRISE_V25/ -o target/portable/BRAINTRADE_V4_ENTERPRISE_V25_P0O_FULL_SOURCE.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: BRAINTRADE-V4-ENTERPRISE-V25-P0O
          path: target/portable/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V25-P0O-Windows-validation-evidence
          path: test-output/v25/
          if-no-files-found: warn
          retention-days: 30
