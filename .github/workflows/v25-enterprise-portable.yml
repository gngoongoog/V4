name: V25 • P0 journal-stable Windows Portable candidate
on:
  push:
    branches:
      - feature/v25-enterprise-validation-20261024
    paths:
      - 'ci/v25_gateway_journal_overlay.py'
      - 'ci/v25_broker_reconciliation_overlay.py'
      - 'ci/v25_core_partial_overlay.py'
      - 'ci/v25_immutable_intent_overlay.py'
      - 'ci/v25_financial_integrity_overlay.py'
      - 'ci/v25_p0e_native_reconnect.patch'
      - 'ci/v25_apply_p0e_patch.py'
      - 'ci/v25_p0f_history_guard_overlay.py'
      - 'ci/v25_p0g_ui_context_overlay.py'
      - 'ci/v25_p0h_panel_generation_overlay.py'
      - 'ci/v25_p0i_panel_order_overlay.py'
      - 'ci/v25_p0j_learning_mode_overlay.py'
      - 'ci/v25_p0n_train_manifest_overlay.py'
      - 'scripts/train_linear_baseline.py'
      - 'tests/test_p0n_certified_training_export.py'
      - 'crates/runtime/src/learning.rs'
      - 'crates/runtime/src/learning_inference.rs'
      - 'ci/v25_p0i_panel_guard.ts'
      - 'ci/v25_p0i_panel_guard.test.mjs'
      - 'tests/test_p0f_history_sync_identity.py'
      - 'gateway/sniper_native.py'
      - 'tests/test_p0e_native_lifecycle.py'
      - 'gateway/mt5_gateway.py'
      - 'gateway/execution.py'
      - 'tests/test_p0d_financial_integrity.py'
      - 'tests/test_broker_intent_identity.py'
      - 'crates/runtime/src/execution_legacy.rs'
      - 'tests/test_broker_reconciliation_strict.py'
      - 'ci/v25-shortcut.ps1'
      - '.github/workflows/v25-enterprise-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v23-windows-portable:
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore V18 baseline and overlay exact V23 changed files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          tar -xzf ci/ui18-source.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore CI baseline' }
          if (!(Test-Path ci/v23-delta.zip)) { throw 'Missing V23 source delta' }
          $sha=(Get-FileHash ci/v23-delta.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '4225eb9e593b3380360f87689cfe267eb134843190e18fddde424e47bf31b485') { throw "V23 delta SHA256 mismatch: $sha" }
          Expand-Archive -Path ci/v23-delta.zip -DestinationPath . -Force
          # The one-time ZIP is an upload transport, not project content.
          # Remove it from Git's checkout index after extraction so the no-artifacts contract stays strict.
          & git rm -q --cached ci/v23-delta.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove transport ZIP from CI index' }
          Remove-Item ci/v23-delta.zip -Force
          # Contract was tightened after V20: stale textual checks must match V23's fail-closed predicates.
          Copy-Item ci/v23-verify-ui20.py scripts/verify_ui20_supervisor.py -Force
          Copy-Item ci/v23-build-tauri.ps1 scripts/Build-Tauri-Windows.ps1 -Force
          # V23 workspace has 3 historical crates plus a separately versioned Tauri wrapper.
          $contract='tests/test_project_contract.py'
          $c=[IO.File]::ReadAllText($contract)
          $old='self.assertEqual(len(packages), 3)'
          $new='self.assertEqual(len([p for p in packages if p["name"] != "braintrade-tauri"]), 3)'
          if (!$c.Contains($old)) { throw 'Expected legacy workspace count check missing' }
          $c=$c.Replace($old,$new)
          $oldV='self.assertTrue(all(p["version"] == workspace for p in packages))'
          $newV='self.assertTrue(all(p["version"] == workspace for p in packages if p["name"] != "braintrade-tauri"))'
          if (!$c.Contains($oldV)) { throw 'Expected legacy package version check missing' }
          [IO.File]::WriteAllText($contract,$c.Replace($oldV,$newV),[Text.Encoding]::UTF8)
          # Strict TypeScript rejects the heterogeneous risk-row label as unknown.
          $tsx='apps/terminal/src/terminal.tsx'
          $markup=[IO.File]::ReadAllText($tsx)
          $from='className="risk-line" key={String(label)}><span>{label}</span>'
          $to='className="risk-line" key={String(label)}><span>{String(label)}</span>'
          if (!$markup.Contains($from)) { throw 'Expected risk-row JSX location missing' }
          [IO.File]::WriteAllText($tsx,$markup.Replace($from,$to),[Text.Encoding]::UTF8)
          if (!(Test-Path crates/runtime/src/enterprise_supervisor.rs)) { throw 'V23 supervisor source missing' }
          if (!(Test-Path scripts/Build-V23-Portable-Windows.ps1)) { throw 'V23 release gate missing' }
          Write-Host 'V23 delta installed over V18 tested CI baseline'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Build entire V23 Rust, React and Gateway portable release
        shell: pwsh
        run: |
          python ci/v23-rust-compiler-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'V23 Rust compiler hotfix gate failed' }
          python ci/v24-shortmode-m15-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'V24 mode-scoped market validation patch failed' }
          python ci/v25_gateway_journal_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 journal race overlay rejected restored source' }
          python ci/v25_broker_reconciliation_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 strict partial-fill reconciliation overlay failed' }
          python ci/v25_immutable_intent_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 immutable broker-intent replay overlay failed' }
          python ci/v25_financial_integrity_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 broker PnL financial integrity overlay failed' }
          # Archived V24 sources differ in unrelated context from tracked V25.
          # Apply only changed hunks with exact unique original anchors.
          # Ambiguity is fatal and cannot silently publish a stale Gateway.
          python ci/v25_apply_p0e_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-E verified native reconnect hunk failed on restored V24' }
          python ci/v25_core_partial_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 Rust Core partial-fill state progression overlay failed' }
          python ci/v25_p0f_history_guard_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-F trading mode-scoped broker history source overlay failed' }
          python ci/v25_p0j_learning_mode_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-J learning snapshot mode isolation source drift or failed' }
          python ci/v25_p0n_train_manifest_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-N certified research trainer source drift or missing manifest gate' }
          python ci/v25_p0g_ui_context_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-G Tauri UI broker-mode context safety overlay failed' }
          python ci/v25_p0h_panel_generation_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-H stale manual IPC context guard overlay failed' }
          python ci/v25_p0i_panel_order_overlay.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-I newest response only / account scope overlay failed' }
          node --experimental-strip-types --test ci/v25_p0i_panel_guard.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-I dynamic concurrent-read race tests failed' }
          node apps/terminal/tests/contracts.cjs
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-G UI account scope contract failed' }
          python ci/v25_tauri_version_stamp.py
          if ($LASTEXITCODE -ne 0) { throw 'V25 Tauri build identity source stamp failed' }
          python -m unittest discover -s tests -p test_execution_journal_race.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 broker journal regression failed' }
          python -m unittest discover -s tests -p test_broker_reconciliation_strict.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 strict broker fill recovery regression failed' }
          python -m unittest discover -s tests -p test_broker_intent_identity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 immutable order-identity regression failed' }
          python -m unittest discover -s tests -p test_p0d_financial_integrity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-D MT5 booked cost and account-mode regression failed' }
          python -m unittest discover -s tests -p test_gateway.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-D dashboard gateway contract regression failed' }
          python -m unittest discover -s tests -p test_p0e_native_lifecycle.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-E native account-switch/reconnect regression failed' }
          python -m unittest discover -s tests -p test_sniper_native_lifecycle.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-E actual Windows pipe lifecycle regression failed' }
          python -m unittest discover -s tests -p test_p0f_history_sync_identity.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-F broker history account mode/fee regression failed' }
          $env:PYTHONDONTWRITEBYTECODE='1'
          python -m unittest discover -s tests -p test_p0n_certified_training_export.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-N offline trainer certification and Demo/REAL gate failed' }
          python -m unittest discover -s tests -p test_feature_ablation.py -v
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-N offline ablation research compatibility test failed' }
          # The historical V23 build script resolves its incomplete Cargo.lock
          # during its normal cargo test; check --locked *after* that resolution.
          # We still block publication if either targeted Rust regression fails.
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Build-V23-Portable-Windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'V23 build / tests / portable smoke failed; do not publish' }
          cargo test --locked -p braintrade-runtime recovered_partial_progress_requires_exact_volume_and_new_broker_deals
          if ($LASTEXITCODE -ne 0) { throw 'V25 Rust Core strict partial-fill helper regression failed' }
          cargo test --locked -p braintrade-runtime late_split_fill_updates_core_result_without_reopening_observed_order
          if ($LASTEXITCODE -ne 0) { throw 'V25 Rust Core partial/observed state transition failed' }
          cargo test --locked -p braintrade-runtime stop_keeps_owned_close_authorized_but_cancels_new_open
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-F STOP/owned-close authorization test failed' }
          cargo test --locked -p braintrade-runtime core_history_sync_fails_closed_for_wrong_mode_cost_or_boundary
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-F broker history Core identity/cost test failed' }
          cargo test --locked -p braintrade-runtime snapshot_context_is_unique_per_verified_demo_real_broker_mode
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-J research learning broker identity mode test failed' }
          cargo test --locked -p braintrade-runtime same_broker_login_and_bar_remain_separate_after_sqlite_reopen
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-J durable SQLite research isolation/restart test failed' }
          cargo test --locked -p braintrade-runtime training_export_skips_untagged_legacy_rows_and_preserves_them_in_db
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-J legacy learning export quarantine test failed' }
          cargo test --locked -p braintrade-runtime learning_export_quarantines_incompatible_feature_and_label_schema
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-K training schema quarantine regression failed' }
          cargo test --locked -p braintrade-runtime damaged_json_export_failure_is_atomic_retryable_and_keeps_source_db
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-L training export atomic cleanup/retry regression failed' }
          cargo test --locked -p braintrade-runtime learning_dashboard_does_not_count_legacy_or_schema_mismatch_as_eligible
          if ($LASTEXITCODE -ne 0) { throw 'V25 P0-M learning evidence counts/false readiness regression failed' }
      - name: Promote tested V23 build outputs to V25 P0 portable and verify archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $oldDir='target/portable/BRAINTRADE-V4-V23-PORTABLE'
          $dir='target/portable/BRAINTRADE-V4-V25-PORTABLE'
          $archive='target/portable/BRAINTRADE-V4-V25-PORTABLE-Win64.zip'
          if (!(Test-Path "$oldDir/BrainTradeNext.exe")) { throw 'New V24 binary was not built' }
          Move-Item -LiteralPath $oldDir -Destination $dir
          $releaseNotes=@(
            'BRAINTRADE V4 ENTERPRISE V25 — P0 BROKER JOURNAL HARDENING CANDIDATE',
            'Based on Windows-built V24 source reconstruction plus narrowly tested V25 broker journal guard.',
            'Concurrent intent journal conflict never dispatches the same order again.',
            'Unavailable SQLite journal means no new order dispatch.',
            'V24 mode-scoped M15 rules and all existing pages/modes are preserved.',
            'Python mock broker regression and offline Core smoke do not prove native MT5 Demo fill.',
            'NOT certified for REAL trading or full 22-page GUI acceptance.',
            'Keep runtime and mt5 folders beside BrainTradeNext.exe. No Setup required.'
          )
          [IO.File]::WriteAllLines((Join-Path $dir 'V25_RELEASE_NOTES.txt'),$releaseNotes,[Text.Encoding]::UTF8)
          if (!(Test-Path 'ci/v25-shortcut.ps1')) { throw 'Missing safe desktop shortcut source' }
          Copy-Item 'ci/v25-shortcut.ps1' (Join-Path $dir 'DESKTOP_SHORTCUT.ps1') -Force
          $createCmd=@'
          @echo off
          setlocal
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0DESKTOP_SHORTCUT.ps1"
          if errorlevel 1 exit /b 1
          echo Desktop shortcut created.
          pause
          '@
          $removeCmd=@'
          @echo off
          setlocal
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0DESKTOP_SHORTCUT.ps1" -Remove
          if errorlevel 1 exit /b 1
          pause
          '@
          [IO.File]::WriteAllText((Join-Path $dir 'CREATE_DESKTOP_ICON.cmd'),$createCmd,[Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $dir 'REMOVE_DESKTOP_ICON.cmd'),$removeCmd,[Text.Encoding]::ASCII)
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'Durable broker journal unavailable; order was not sent' -Quiet)) {
            throw 'V25 journal race protection is not present in packaged runtime'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'Broker fill volume exceeds submitted volume; reconciliation pending' -Quiet)) {
            throw 'V25 P0-B broker reconciliation guard missing from packaged runtime'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'Immutable intent' -Quiet) -and -not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'immutable=(' -Quiet)) {
            throw 'V25 P0-C immutable intent binding missing from packaged runtime'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/mt5_gateway.py') -SimpleMatch 'Broker deal cost fields missing or invalid; daily PnL is unknown.' -Quiet)) {
            throw 'V25 P0-D verified broker booked net PnL requirement absent in release'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'No guessed zero commission / swap / fee' -Quiet)) {
            throw 'V25 P0-D fail-closed daily risk costs are missing from the release'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/sniper_native.py') -SimpleMatch 'self.blocked = True' -Quiet)) {
            throw 'V25 P0-E blocked pipe safety flag absent from published Python runtime'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/mt5_gateway.py') -SimpleMatch 'native.recent(login=' -Quiet)) {
            throw 'V25 P0-E account-scoped native tick fallback absent from published Python runtime'
          }
          if (-not (Select-String -Path (Join-Path $dir 'runtime/gateway/execution.py') -SimpleMatch 'Older Core responses without trade_mode are not safe to sync.' -Quiet)) {
            throw 'V25 P0-F mode-scoped financial history gate missing from published Gateway'
          }
          $v24exe='9e8011178c581bc89dcb45f62de7320abd1031dfa4f597425ed2c64d33b64d14'
          $newexe=(Get-FileHash (Join-Path $dir 'BrainTradeNext.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($newexe -eq $v24exe) { throw 'Compiled EXE still matches archived V24 executable; refusing a falsely renamed V25 release' }
          $exeBytes=[IO.File]::ReadAllBytes((Join-Path $dir 'BrainTradeNext.exe'))
          $exeAscii=[Text.Encoding]::ASCII.GetString($exeBytes)
          if (!$exeAscii.Contains('BRAINTRADE_V4_ENTERPRISE_V25_P0_20261024')) { throw 'Compiled EXE missing its V25 build identity marker' }
          $checks=@{}
          $basePath=(Resolve-Path $dir).Path
          Get-ChildItem $dir -File -Recurse | Where-Object {$_.Name -ne 'SHA256SUMS.json'} | ForEach-Object {
            $relative=$_.FullName.Substring($basePath.Length+1).Replace('\','/')
            $checks[$relative]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [IO.File]::WriteAllText((Join-Path $dir 'SHA256SUMS.json'),($checks|ConvertTo-Json -Depth 2),[Text.Encoding]::UTF8)
          Compress-Archive -Path $dir -DestinationPath $archive -CompressionLevel Optimal -Force
          foreach($path in @($archive, "$dir/BrainTradeNext.exe", "$dir/runtime/python/python.exe", "$dir/runtime/gateway/mt5_gateway.py", "$dir/mt5/Experts/BrainTradeSniperBridge.mq5", "$dir/SHA256SUMS.json")) {
            if(!(Test-Path $path -PathType Leaf)) { throw "V25 portable missing: $path" }
          }
          $manifest=Get-Content "$dir/SHA256SUMS.json" -Raw | ConvertFrom-Json
          $members=@(Get-ChildItem $dir -File -Recurse)
          foreach($member in $members){
            if($member.Name -eq 'SHA256SUMS.json') { continue }
            $relative=$member.FullName.Substring((Resolve-Path $dir).Path.Length+1).Replace('\','/')
            $expected=$manifest.PSObject.Properties[$relative].Value
            if(!$expected) { throw "Manifest missing: $relative" }
            $actual=(Get-FileHash $member.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($expected -ne $actual) { throw "Manifest mismatch: $relative" }
          }
          if ($members.Count -lt 100) { throw 'V24 archive unexpectedly contains too few files' }
          Get-FileHash $archive -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: BRAINTRADE-V4-V25-PORTABLE-WINDOWS-CORE-SMOKE
          path: target/portable/BRAINTRADE-V4-V25-PORTABLE-Win64.zip
          if-no-files-found: error
          retention-days: 30
