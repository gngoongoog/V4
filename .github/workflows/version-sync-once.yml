name: One-shot 0.7 lock repair
on:
  push:
    branches: [feature/version-0.7-preview]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/version-0.7-preview
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore previous lock and change workspace package versions only
        shell: bash
        run: |
          git show 07a8de3bcc2181830568ff59eb8fda0c61745a4c:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('Cargo.lock')
          text = path.read_text(encoding='utf-8')
          for name in ('braintrade-desktop', 'braintrade-domain', 'braintrade-runtime'):
              pattern = rf'(\[\[package\]\]\nname = "{name}"\nversion = ")0\.6\.0(")'
              text, count = re.subn(pattern, rf'\g<1>0.7.0\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one workspace version for {name}, got {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify locked workspace resolves without mutation
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "Cargo.lock"
      - name: Commit repaired lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Keep 0.7.0 lockfile dependency pins unchanged"
          git push origin HEAD:feature/version-0.7-preview
