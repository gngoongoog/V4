name: Validate Shadow Adaptive Exit

on:
  push:
    branches:
      - research/shadow-adaptive-exit
    paths:
      - .github/workflows/validate-shadow-exit.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/shadow-adaptive-exit
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix, format and test shadow exit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/runtime/src/shadow_exit.rs')
          text = path.read_text(encoding='utf-8')
          old = '    let dir = direction(p)?;\n'
          new = '    let Some(dir) = direction(p) else { return Ok(None); };\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p braintrade-runtime shadow_exit --locked
          git diff --check
      - name: Commit validated formatting
        shell: bash
        run: |
          git config user.name "gngoongoog"
          git config user.email "95882142+gngoongoog@users.noreply.github.com"
          git add crates/runtime/src/shadow_exit.rs crates/runtime/src/execution.rs crates/runtime/src/lib.rs
          git commit -m "Fix and format Shadow Adaptive Exit research" || exit 0
          git push origin HEAD:research/shadow-adaptive-exit
