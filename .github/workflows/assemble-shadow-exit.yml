name: Assemble Shadow Adaptive Exit

on:
  push:
    branches: [research/shadow-adaptive-exit]
    paths:
      - crates/runtime/src/shadow_exit.rs
      - .github/workflows/assemble-shadow-exit.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/shadow-adaptive-exit
      - name: Integrate research-only shadow exit
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/runtime/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          anchor = 'mod execution;\n'
          assert anchor in text and 'mod shadow_exit;' not in text
          text = text.replace(anchor, anchor + 'mod shadow_exit;\n', 1)
          lib.write_text(text, encoding='utf-8')

          path = Path('crates/runtime/src/execution.rs')
          text = path.read_text(encoding='utf-8')

          anchor = '        let mut inner = legacy::Service::new(db)?;\n'
          assert anchor in text
          text = text.replace(anchor, anchor + '        crate::shadow_exit::init(db)?;\n', 1)

          anchor = '''        self.inner
            .observe(db, telemetry, config, run, frames, now)?;
'''
          assert anchor in text
          text = text.replace(anchor, anchor + '''        // Research-only adaptive-exit challenger runs only on the full reconciled
        // snapshot path. It never runs on the 5 ms Sniper pulse and cannot queue orders.
        crate::shadow_exit::observe(db, telemetry, config, &available, now)?;
''', 1)

          anchor = '''        // A brain role change must never arm global START implicitly. START/STOP is a
'''
          assert anchor in text
          text = text.replace(anchor, '''        if method == "GET" && path == "/v1/execution/shadow-exit" {
            return crate::shadow_exit::summary(db, status.telemetry.as_ref());
        }

''' + anchor, 1)

          anchor = '''            value["portfolio"] = self.portfolio_state.clone();
            Ok(value)
'''
          assert anchor in text
          text = text.replace(anchor, '''            value["portfolio"] = self.portfolio_state.clone();
            value["shadow_exit"] = crate::shadow_exit::summary(db, status.telemetry.as_ref())?;
            Ok(value)
''', 1)

          text = text.replace('value["execution_model"] = json!("adaptive-member-coordinator-v1");', 'value["execution_model"] = json!("braintrade-intelligence-v3");', 1)
          old_note = 'value["note"] = json!("العقل الرئيسي يعمل مع START. العقول الثانوية تشارك كمستشارين افتراضياً؛ تفعيل SOLO يفصل العقل المختار فقط، وإطفاؤه يعيده بعد تسوية صفقة SOLO المفتوحة. التعلم يحدّث وزن العضو بعد 12 شمعة لاحقة؛ أول 20 عينة تستخدم وزناً محايداً. START/STOP منفصلان عن زر العضوية.");'
          new_note = 'value["note"] = json!("العقل الرئيسي Intelligence V3 يعمل مع START. العقول الثانوية مستشارون افتراضياً؛ SOLO يفصل العقل المختار فقط. Broker evidence الحقيقي مفضل، والـforward/counterfactual سببي للبحث. Shadow Adaptive Exit بحثي فقط ولا يرسل أوامر. START/STOP منفصلان عن العضوية.");'
          assert old_note in text
          text = text.replace(old_note, new_note, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit assembled integration
        shell: bash
        run: |
          git config user.name "gngoongoog"
          git config user.email "95882142+gngoongoog@users.noreply.github.com"
          git add crates/runtime/src/lib.rs crates/runtime/src/execution.rs
          git diff --cached --check
          git commit -m "Integrate research-only Shadow Adaptive Exit"
          git push origin HEAD:research/shadow-adaptive-exit
