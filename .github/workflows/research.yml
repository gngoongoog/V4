name: Research source validation
on:
  workflow_dispatch:
  push:
    branches: [development]
jobs:
  build-only:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check domain and runtime compilation only
        run: cargo check -p braintrade-domain -p braintrade-runtime --locked
      - name: Check Python gateway and offline trainer syntax only
        run: python3 -m py_compile gateway/mt5_gateway.py scripts/train_linear_baseline.py
      - name: Install native font build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Check desktop compilation only
        shell: bash
        run: |
          mkdir -p test-output
          set -o pipefail
          cargo check -p braintrade-desktop --locked 2>&1 | tee test-output/desktop-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-only-validation
          path: test-output/
  research:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[build-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test -p braintrade-domain -p braintrade-runtime --locked
      - run: cargo build -p braintrade-runtime --bin braintrade-core --locked
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/smoke_core.py
      - name: Install browser test dependency
        run: |
          npm install --prefix .ci --no-save --package-lock=false playwright@1.51.1
          .ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify offline report interactions
        run: NODE_PATH="$GITHUB_WORKSPACE/.ci/node_modules" node scripts/check_trade_review.cjs
      - name: Install native font build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev
      - name: Check native selector compilation on Linux
        shell: bash
        run: |
          mkdir -p test-output
          set -o pipefail
          cargo check -p braintrade-desktop --locked 2>&1 | tee test-output/desktop-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-research-validation
          path: test-output/
